version: "3.9"

services:
  bot:
    build: .
    container_name: telegram_video_downloader_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "bot.main", "--help"]
      interval: 60s
      timeout: 10s
      retries: 3
